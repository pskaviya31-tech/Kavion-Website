<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
       html,body {
            margin: 0;
            padding: 0;
            height: 100%;
        }

        .splashbg {
            width: 100%;
            height: 100%;
            background-color: #f8e831;
            position: relative;
            animation: fade 7s ease-out infinite alternate;
    }

        
        @keyframes fade {
      from { opacity: 1; transform: scale(1); }
      to { opacity: 0.5; transform: scale(1.1); }
    }
    </style>
</head>
<body>
    <div class="splashbg">
        <img style="position: absolute; width: 550px; margin-top: 100px; margin-left: 480px;" src="Happy Shopping Bag Cart Logo (1).png" alt="">
    </div>
</body>
<script>
setTimeout(() => {
      window.location.href = "index.html"; 
    },1500);
</script>
</html>
